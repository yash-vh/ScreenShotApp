name: ScreenshotApp
options:
  bundleIdPrefix: com.screenshotapp
  createIntermediateGroups: true
  xcodeVersion: "15.0"
  deploymentTarget:
    macOS: "14.0"

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.9"
    ENABLE_HARDENED_RUNTIME: YES
    COMBINE_HIDPI_IMAGES: YES

fileGroups:
  - Configuration
  - Branding
  - Scripts

targets:
  ScreenshotApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    scheme:
      testTargets:
        - ScreenshotAppTests
      # Local StoreKit testing for the SyncShot Pro subscription (Run action only)
      storeKitConfiguration: Configuration/SyncShot.storekit
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
          - "Resources/LaunchAgents"
      # launchd agent behind BackgroundRelauncher; SMAppService.agent looks in Contents/Library/LaunchAgents
      - path: Sources/Resources/LaunchAgents
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.screenshotapp.mac
      PRODUCT_NAME: SyncShot
      PRODUCT_MODULE_NAME: ScreenshotApp
      INFOPLIST_FILE: Sources/Resources/Info.plist
      CODE_SIGN_ENTITLEMENTS: Sources/Resources/ScreenshotApp.entitlements
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: NO
      CODE_SIGN_IDENTITY: "-"
      # Stable designated requirement so Screen Recording (TCC) permission survives rebuilds.
      # Xcode's CodeSign step applies it (and the entitlements) as the last build step; a post-build
      # re-sign script would run before that step and be overwritten.
      OTHER_CODE_SIGN_FLAGS: "-r=\"designated => identifier \\\"com.screenshotapp.mac\\\"\""

  ScreenshotAppTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
        excludes:
          - "**/*.md"
    dependencies:
      - target: ScreenshotApp
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.screenshotapp.mac.tests
      PRODUCT_NAME: ScreenshotAppTests
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SyncShot.app/Contents/MacOS/SyncShot"
      GENERATE_INFOPLIST_FILE: YES
