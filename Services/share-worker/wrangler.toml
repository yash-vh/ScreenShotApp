name = "shotlink-share"
main = "src/index.js"
compatibility_date = "2025-01-01"

[vars]
# Contact shown on every share page for abuse reports
ABUSE_EMAIL = "abuse@example.com"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "shotlink-uploads"

# Per-install upload limit (60 reservations per 60 s window per install ID / IP)
[[unsafe.bindings]]
name = "UPLOAD_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Daily sweep of expired and abandoned uploads
[triggers]
crons = ["17 3 * * *"]
